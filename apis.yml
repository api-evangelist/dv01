aid: dv01
name: dv01
description: >-
  dv01 is an "InvestorTech" data and analytics platform for the structured finance and consumer-lending
  markets, part of Fitch Group. It aggregates, standardizes, and validates loan-level data across asset
  classes (RMBS, auto, student loans, personal loans, buy-now-pay-later) and delivers it, along with
  reporting and surveillance tooling, to issuers, lenders, and investors. Products include Data Direct,
  Data Management, DealStudio, Securitizations, Tape Cracker, and portfolio/market surveillance. dv01
  publishes no public developer REST API or OpenAPI; data is delivered into client environments via
  Snowflake Data Share, BigQuery, SFTP, and S3. This profile was surfaced as a portfolio company of
  Ribbit Capital and enriched with verified public identity, compliance, and domain-security signals.
